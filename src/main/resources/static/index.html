<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'; img-src 'self' data:">
  <title>Kafka Tester</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <nav class="topnav" aria-label="Main">
    <div class="brand">&#9889; Kafka Tester</div>
    <a class="navlink" href="#/producer" data-route="producer">Producer</a>
    <a class="navlink" href="#/consumers" data-route="consumers">Consumers</a>
    <a class="navlink" href="#/catalog" data-route="catalog">Event Catalog</a>
  </nav>

  <!-- Global error/notice banner (App.showBanner) -->
  <div id="banner-root"></div>

  <!-- Screens mount here; see the extension-point documentation at the top of js/app.js -->
  <main id="screen-root" class="page"></main>

  <!-- Shared modal slot: App.openModal(...) renders .modal-backdrop > .modal here. -->
  <div id="modal-root"></div>

  <!-- Toasts (App.toast) -->
  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <!-- Scripts: order matters (apiClient before app before screens). No inline scripts or styles (CSP). -->
  <script src="js/apiClient.js"></script>
  <script src="js/app.js"></script>
  <script src="js/producer.js"></script>
  <script src="js/consumers.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/registration.js"></script>
</body>
</html>
